<html>
<head>
	<title>Grade Calculator</title>

	<style>
	.gradeInput{
		width:55px;
		border:none;
		text-align:center;
		font-family:Lexend;
		font-weight:bold;
		color:black;
		background:transparent;
	}

	.calculated{
		color:red;
	}
	</style>
</head>

<body>

<p>&nbsp;</p>

<table border="1" cellpadding="0" cellspacing="0" data-sheets-baot="1" data-sheets-root="1" dir="ltr" style="table-layout: fixed; font-size: 10pt; font-family: Arial; width: 430px; border-collapse: collapse; border-width: medium; border-style: none; border-color: currentcolor; border-image: initial;" xmlns="http://www.w3.org/1999/xhtml">
	<colgroup>
		<col width="150" />
		<col width="65" />
		<col width="20" />
		<col width="189" />
	</colgroup>

	<tbody>

		<tr style="height: 21px;">
			<td colspan="2" rowspan="1" style="border: 1px solid rgb(0, 0, 0); overflow: hidden; padding: 2px 3px; vertical-align: bottom; background-color: rgb(239, 239, 239); font-family: Lexend; font-size: 11pt; font-weight: bold; text-align: center;">
				Grade Calculator
			</td>

			<td colspan="1" rowspan="7" style="border-width: 1px; border-style: solid; border-color: rgb(255, 255, 255) rgb(0, 0, 0) rgb(255, 255, 255) rgb(204, 204, 204); border-image: initial; overflow: hidden; padding: 2px 3px; vertical-align: bottom;">
				<div style="max-height: 126px;">&nbsp;</div>
			</td>

			<td style="border-width: 1px; border-style: solid; border-color: rgb(0, 0, 0) rgb(0, 0, 0) rgb(0, 0, 0) rgb(204, 204, 204); border-image: initial; overflow: hidden; padding: 2px 3px; vertical-align: bottom; background-color: rgb(239, 239, 239); font-family: Lexend; font-size: 11pt; font-weight: bold; text-align: center;">
				Directions
			</td>
		</tr>

		<tr style="height: 21px;">
			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(204, 204, 204) rgb(204, 204, 204) rgb(0, 0, 0); overflow: hidden; padding: 2px 3px; vertical-align: bottom; font-family: Lexend; text-align: right;">
				1st Semester Average:
			</td>

			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(0, 0, 0) rgb(204, 204, 204) rgb(204, 204, 204); overflow: hidden; padding: 2px 3px; vertical-align: bottom; text-align: center;">
				<input type="number" id="S1" class="gradeInput" />
			</td>

			<td colspan="1" rowspan="6" style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(0, 0, 0) rgb(0, 0, 0) rgb(204, 204, 204); border-image: initial; overflow: hidden; padding: 2px 3px; vertical-align: middle; font-family: Lexend; font-size: 9pt; overflow-wrap: break-word;">
				<div style="max-height: 105px;">
					<span style="font-size: 9pt; font-family: Lexend, Arial;">
						Fill in any
					</span>

					<span style="font-size: 9pt; font-family: Lexend, Arial; font-weight: bold; text-decoration: underline;">
						4
					</span>

					<span style="font-size: 9pt; font-family: Lexend, Arial;">
						of the
					</span>

					<span style="font-size: 9pt; font-family: Lexend, Arial; font-weight: bold; text-decoration: underline;">
						5
					</span>

					<span style="font-size: 9pt; font-family: Lexend, Arial;">
						values on the right. Press [Calculate] to find the missing grade.
					</span>
				</div>
			</td>
		</tr>

		<tr style="height: 21px;">
			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(204, 204, 204) rgb(204, 204, 204) rgb(0, 0, 0); overflow: hidden; padding: 2px 3px; vertical-align: bottom; font-family: Lexend; text-align: right;">
				Marking Period 3:
			</td>

			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(0, 0, 0) rgb(204, 204, 204) rgb(204, 204, 204); overflow: hidden; padding: 2px 3px; vertical-align: bottom; text-align: center;">
				<input type="number" id="M3" class="gradeInput" />
			</td>
		</tr>

		<tr style="height: 21px;">
			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(204, 204, 204) rgb(204, 204, 204) rgb(0, 0, 0); overflow: hidden; padding: 2px 3px; vertical-align: bottom; font-family: Lexend; text-align: right;">
				Marking Period 4:
			</td>

			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(0, 0, 0) rgb(204, 204, 204) rgb(204, 204, 204); overflow: hidden; padding: 2px 3px; vertical-align: bottom; text-align: center;">
				<input type="number" id="M4" class="gradeInput" />
			</td>
		</tr>

		<tr style="height: 21px;">
			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(204, 204, 204) rgb(204, 204, 204) rgb(0, 0, 0); overflow: hidden; padding: 2px 3px; vertical-align: bottom; font-family: Lexend; text-align: right;">
				Spring Final Exam:
			</td>

			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(0, 0, 0) rgb(204, 204, 204) rgb(204, 204, 204); overflow: hidden; padding: 2px 3px; vertical-align: bottom; text-align: center;">
				<input type="number" id="FE" class="gradeInput" />
			</td>
		</tr>

		<tr style="height: 21px;">
			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(204, 204, 204) rgb(0, 0, 0) rgb(0, 0, 0); overflow: hidden; padding: 2px 3px; vertical-align: bottom; font-family: Lexend; text-align: right;">
				Overall Year Average:
			</td>

			<td style="border-width: 1px; border-style: solid; border-color: rgb(204, 204, 204) rgb(0, 0, 0) rgb(0, 0, 0) rgb(204, 204, 204); overflow: hidden; padding: 2px 3px; vertical-align: bottom; text-align: center;">
				<input type="number" id="YR" class="gradeInput" />
			</td>
		</tr>

		<tr>
			<td colspan="2" style="border: 1px solid black; text-align: center; padding: 8px;">
				<button onclick="calculateGrade()" style="font-family: Lexend; padding: 4px 14px; cursor: pointer;">
					Calculate
				</button>
			</td>
		</tr>

	</tbody>
</table>

<p id="message" style="font-family: Lexend; color: red; margin-top: 10px;"></p>

<p>&nbsp;</p>
<p>&nbsp;</p>

<script>
function calculateGrade() {

	const fields = ["S1", "M3", "M4", "FE", "YR"];

	// Reset all fields to black
	fields.forEach(id => {
		document.getElementById(id).classList.remove("calculated");
	});

	const S1 = parseFloat(document.getElementById("S1").value);
	const M3 = parseFloat(document.getElementById("M3").value);
	const M4 = parseFloat(document.getElementById("M4").value);
	const FE = parseFloat(document.getElementById("FE").value);
	const YR = parseFloat(document.getElementById("YR").value);

	const values = { S1, M3, M4, FE, YR };

	let emptyFields = [];

	for (let key in values) {
		if (isNaN(values[key])) {
			emptyFields.push(key);
		}
	}

	if (emptyFields.length !== 1) {
		document.getElementById("message").innerText =
			"Please fill in exactly 4 of the 5 values.";
		return;
	}

	document.getElementById("message").innerText = "";

	let result;
	let solvedField = emptyFields[0];

	switch (solvedField) {

		case "FE":
			result =
				(YR - (S1 * 0.5) - (M3 * 0.225) - (M4 * 0.225)) / 0.05;
			break;

		case "YR":
			result =
				(S1 * 0.5) + (M3 * 0.225) + (M4 * 0.225) + (FE * 0.05);
			break;

		case "S1":
			result =
				(YR - (M3 * 0.225) - (M4 * 0.225) - (FE * 0.05)) / 0.5;
			break;

		case "M3":
			result =
				(YR - (S1 * 0.5) - (M4 * 0.225) - (FE * 0.05)) / 0.225;
			break;

		case "M4":
			result =
				(YR - (S1 * 0.5) - (M3 * 0.225) - (FE * 0.05)) / 0.225;
			break;
	}

	document.getElementById(solvedField).value = result.toFixed(2);

	// Make solved field red
	document.getElementById(solvedField).classList.add("calculated");
}
</script>

</body>
</html>
