<html>
<head>
	<title>EOY Grade Calculator</title>

	<style>
	.gradeInput{
			width:55px;
			border:none;
			text-align:center;
			font-family:Lexend;
			font-weight:bold;
			font-size:11pt;
			color:black;
			background:transparent;
			outline:none;
	}

	.calculated{
			color:red;
	}

	/* OUTER LAYOUT TABLE = NO BORDERS */
	.outerTable,
	.outerTable td{
			border:none !important;
			border-collapse:collapse;
	}

	/* INNER CALCULATOR TABLES */
	.calcTable{
			border-collapse:collapse;
	}

	.calcTable td{
			border:0.5px solid black;
	}

	button{
			font-family:Lexend;
			font-size:10pt;
			padding:3px 10px;
			cursor:pointer;
	}
	</style>
</head>

<body>

<table class="outerTable" align="center" cellpadding="1" cellspacing="0" border="none" style="width:600px;">
	<tbody>
		<tr>

			<!-- LEFT SIDE -->
			<td style="vertical-align:top;">

			<table class="calcTable" border="1" style="table-layout:fixed; font-size:10pt; font-family:Arial;">

				<colgroup>
					<col width="150" />
					<col width="65" />
				</colgroup>

				<tbody>

					<tr style="height:21px;">
						<td colspan="2" style="background:#efefef; font-family:Lexend; font-size:11pt; font-weight:bold; text-align:center;">
							EOY Grade Calculator
						</td>
					</tr>

					<tr style="height:21px;">
						<td style="font-family:Lexend; text-align:right;">
							1st Semester Average:
						</td>

						<td style="text-align:center;">
							<input type="number" id="S1" class="gradeInput">
						</td>
					</tr>

					<tr style="height:21px;">
						<td style="font-family:Lexend; text-align:right;">
							Marking Period 3:
						</td>

						<td style="text-align:center;">
							<input type="number" id="M3" class="gradeInput">
						</td>
					</tr>

					<tr style="height:21px;">
						<td style="font-family:Lexend; text-align:right;">
							Marking Period 4:
						</td>

						<td style="text-align:center;">
							<input type="number" id="M4" class="gradeInput">
						</td>
					</tr>

					<tr style="height:21px;">
						<td style="font-family:Lexend; text-align:right;">
							Spring Final Exam:
						</td>

						<td style="text-align:center;">
							<input type="number" id="FE" class="gradeInput">
						</td>
					</tr>

					<tr style="height:21px;">
						<td style="font-family:Lexend; text-align:right;">
							Overall Year Average:
						</td>

						<td style="text-align:center;">
							<input type="number" id="YR" class="gradeInput">
						</td>
					</tr>

					<tr>
						<td colspan="2" style="text-align:center; padding:6px;">

							<button onclick="calculateGrade()">
								Calculate
							</button>

							<button onclick="clearAll()">
								Clear
							</button>

						</td>
					</tr>

				</tbody>
			</table>

			</td>

			<!-- RIGHT SIDE -->
			<td style="vertical-align:top; text-align:center;">

			<table class="calcTable" style="table-layout:fixed; font-size:10pt; font-family:Arial;">

				<colgroup>
					<col width="189" />
				</colgroup>

				<tbody>

					<tr style="height:21px;">
						<td style="background:#efefef; font-family:Lexend; font-size:11pt; font-weight:bold;">
							Directions
						</td>
					</tr>

					<tr>
						<td style="font-family:Lexend; font-size:9pt; padding:6px; overflow-wrap:break-word;">

							<p>
								Fill in <strong><u>4</u></strong> values on the left.
							</p>

							<p>
								Press <strong>[Calculate]</strong> to find the missing grade.
							</p>

							<p>
								Press <strong>[Clear]</strong> to erase all entries.
							</p>

						</td>
					</tr>

				</tbody>
			</table>

			<p id="message" style="font-family:Lexend; color:red;"></p>

			</td>

		</tr>
	</tbody>
</table>

<script>
const fields = ["S1","M3","M4","FE","YR"];

/* ENTER KEY → NEXT FIELD */
fields.forEach((id, index) => {

	document.getElementById(id).addEventListener("keydown", function(e){

		if(e.key === "Enter"){

			e.preventDefault();

			if(fields[index + 1]){
				document.getElementById(fields[index + 1]).focus();
			}
		}
	});
});

/* CLEAR ALL */
function clearAll(){

	fields.forEach(id => {

		const el = document.getElementById(id);

		el.value = "";
		el.classList.remove("calculated");
	});

	document.getElementById("message").innerText = "";
}

/* CALCULATE */
function calculateGrade(){

	fields.forEach(id => {
		document.getElementById(id).classList.remove("calculated");
	});

	const S1 = parseFloat(document.getElementById("S1").value);
	const M3 = parseFloat(document.getElementById("M3").value);
	const M4 = parseFloat(document.getElementById("M4").value);
	const FE = parseFloat(document.getElementById("FE").value);
	const YR = parseFloat(document.getElementById("YR").value);

	const values = {S1,M3,M4,FE,YR};

	let empty = [];

	for(let k in values){
		if(isNaN(values[k])) empty.push(k);
	}

	if(empty.length !== 1){

		document.getElementById("message").innerText =
			"Fill exactly 4 values.";

		return;
	}

	document.getElementById("message").innerText = "";

	let missing = empty[0];
	let result;

	if(missing === "FE"){

		result =
			(YR - (S1*0.5) - (M3*0.225) - (M4*0.225)) / 0.05;

	}else if(missing === "YR"){

		result =
			(S1*0.5) + (M3*0.225) + (M4*0.225) + (FE*0.05);

	}else if(missing === "S1"){

		result =
			(YR - (M3*0.225) - (M4*0.225) - (FE*0.05)) / 0.5;

	}else if(missing === "M3"){

		result =
			(YR - (S1*0.5) - (M4*0.225) - (FE*0.05)) / 0.225;

	}else if(missing === "M4"){

		result =
			(YR - (S1*0.5) - (M3*0.225) - (FE*0.05)) / 0.225;
	}

	const el = document.getElementById(missing);

	el.value = result.toFixed(2);
	el.classList.add("calculated");
}
</script>

</body>
</html>
